components:
  schemas:
    CreateRlsRequest:
      title: CreateRlsRequest
      type: object
      additionalProperties: false
      required:
      - name
      - code
      - latitude
      - longitude
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 20
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        frequency_min:
          type: number
          format: double
          minimum: 0
        frequency_max:
          type: number
          format: double
          minimum: 0
        description:
          type: string
          maxLength: 1000
          nullable: true
    Rls:
      title: Rls
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - code
      - latitude
      - longitude
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: rls_abc123
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Station Alpha
        code:
          type: string
          minLength: 1
          maxLength: 20
          example: RLS-001
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 55.7558
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 37.6173
        frequency_min:
          type: number
          format: double
          minimum: 0
          description: Minimum operating frequency in MHz
          example: 2.8
        frequency_max:
          type: number
          format: double
          minimum: 0
          description: Maximum operating frequency in MHz
          example: 40
        description:
          type: string
          maxLength: 1000
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    RlsList:
      title: RlsList
      type: object
      additionalProperties: false
      required:
      - items
      - total
      - page
      - size
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Rls'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 200
    UpdateRlsRequest:
      title: UpdateRlsRequest
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 20
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        frequency_min:
          type: number
          format: double
          minimum: 0
        frequency_max:
          type: number
          format: double
          minimum: 0
        description:
          type: string
          maxLength: 1000
          nullable: true
